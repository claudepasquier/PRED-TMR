name: pages

on:
  push:
    branches: [main]
    paths:
      - "**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel an in-progress run so
# that a deployment already published is not interrupted.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build WebAssembly portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build WASM module
        run: scripts/build-wasm.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload portal artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
