# Koda (CNRS GitLab) CI — mirrors the GitHub Actions build.yml quality gates:
# native CMake build + ctest. The WASM build is GitHub-only (emsdk setup is
# handled by mymindstorm/setup-emsdk there; not needed for Koda validation).
#
# Runner constraints (see project CI skill):
# - Only whitelisted images are allowed; use the docker-ci mirror.
# - apt is BLOCKED by the runner HTTP proxy (403 on deb.debian.org), so the
#   slim image cannot be extended at job time. Use the FULL python image
#   (buildpack-deps based: gcc/g++/make preinstalled) and get cmake from PyPI.

stages:
  - build
  - test

.native_build:
  stage: build
  image: bin.koda.cnrs.fr/docker-ci/python:3.12
  before_script:
    - 'pip install --no-cache-dir cmake || echo "WARNING: pip cmake unavailable; relying on preinstalled cmake"'
    - cmake --version
    - g++ --version
  script:
    - cmake -S . -B build -DPREDTMR_BUILD_WASM=OFF -DPREDTMR_BUILD_TESTS=ON
    - cmake --build build --parallel
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

native_build:
  extends: .native_build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

native_test:
  stage: test
  image: bin.koda.cnrs.fr/docker-ci/python:3.12
  needs:
    - native_build
  before_script:
    - 'pip install --no-cache-dir cmake || echo "WARNING: pip cmake unavailable; relying on preinstalled cmake"'
  script:
    - ctest --test-dir build --output-on-failure
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
