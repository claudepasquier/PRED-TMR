# Koda (CNRS GitLab) CI — mirrors the GitHub Actions build.yml quality gates:
# native CMake build + ctest. The WASM build is GitHub-only (emsdk setup is
# handled by mymindstorm/setup-emsdk there; not needed for Koda validation).
#
# Runner constraints (see project CI skill):
# - Only whitelisted images are allowed; use the docker-ci mirror.
# - apt may be blocked on restricted runners -> best-effort install.

stages:
  - build
  - test

.native_build:
  stage: build
  image: bin.koda.cnrs.fr/docker-ci/python:3.12-slim
  before_script:
    - 'apt-get update && apt-get install -y --no-install-recommends build-essential cmake || echo "WARNING: apt-get unavailable; relying on preinstalled toolchain"'
    - cmake --version
  script:
    - cmake -S . -B build -DPREDTMR_BUILD_WASM=OFF -DPREDTMR_BUILD_TESTS=ON
    - cmake --build build --parallel
  artifacts:
    paths:
      - build/
    expire_in: 1 hour

native_build:
  extends: .native_build
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

native_test:
  stage: test
  image: bin.koda.cnrs.fr/docker-ci/python:3.12-slim
  needs:
    - native_build
  before_script:
    - 'apt-get update && apt-get install -y --no-install-recommends cmake || echo "WARNING: apt-get unavailable; relying on preinstalled cmake"'
  script:
    - ctest --test-dir build --output-on-failure
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
